<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kokanastha Operation</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; z-index: 999999; position: relative;"></div>
    <script>
      window.addEventListener("error", function(e) {
        var msg = e.error ? e.error.stack || e.error.message : e.message || "";
        if (msg.indexOf("WebSocket") !== -1 || msg.indexOf("ws://") !== -1 || msg.indexOf("wss://") !== -1) return;
        var el = document.getElementById("error-log");
        if (el) el.innerText += msg + "\n";
      });
      window.addEventListener("unhandledrejection", function(e) {
        var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e);
        if (reason.indexOf("WebSocket") !== -1 || reason.indexOf("ws://") !== -1 || reason.indexOf("wss://") !== -1) {
          e.preventDefault && e.preventDefault();
          return;
        }
        var el = document.getElementById("error-log");
        if (el) el.innerText += "Unhandled Promise Rejection: " + reason + "\n";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
